name: Release

# Push a tag like v1.0.0 and this builds Sift and attaches the download to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests
        run: scripts/test.sh
      - name: Build the app and disk image
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-dmg.sh
      - name: Sign the update for the in-app updater
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-appcast.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Sift ${GITHUB_REF_NAME#v}" --generate-notes
